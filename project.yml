name: MorseThanWords

options:
  bundleIdPrefix: com.norberttak
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  MorseKit:
    path: Packages/MorseKit

targets:
  MorseThanWords:
    type: application
    platform: iOS
    sources:
      - path: MorseThanWords
        type: syncedFolder
    dependencies:
      - package: MorseKit
    info:
      path: Config/MorseThanWords-Info.plist
      properties:
        CFBundleDisplayName: Morse Than Words
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.norberttak.morsethanwords
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # DEVELOPMENT_TEAM: set your Apple Developer Team ID before device/TestFlight builds

  MorseThanWordsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MorseThanWordsTests
        type: syncedFolder
    dependencies:
      - target: MorseThanWords
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.norberttak.morsethanwords.tests
        GENERATE_INFOPLIST_FILE: YES

  MorseThanWordsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MorseThanWordsUITests
        type: syncedFolder
    dependencies:
      - target: MorseThanWords
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.norberttak.morsethanwords.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MorseThanWords

schemes:
  MorseThanWords:
    build:
      targets:
        MorseThanWords: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - MorseThanWords
      targets:
        - MorseThanWordsTests
        - MorseThanWordsUITests
        - package: MorseKit/MorseKitTests
    archive:
      config: Release
